# Infynit AI (PC) - configuração lida pelos scripts da sessão
# Formato: CHAVE=valor (sem espaços ao redor do =)

# Modo econômico: 1 = sem pcmanfm --desktop (sem ícones) e sem compositor. Aplica ao reiniciar a sessão.
AMBXST_ECO=0
# 1 = compositor picom (cantos arredondados + transparência). Se falhar, o desktop segue sem efeitos.
AMBXST_PICOM=1
