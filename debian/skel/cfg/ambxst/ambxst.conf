# Infynit AI - configuração (lida pelos scripts do Termux E do Debian)
# Formato: CHAVE=valor (sem espaços ao redor do =)

# Modo econômico: 1 = sem pcmanfm --desktop (sem ícones), sem áudio, sem compositor.
AMBXST_ECO=0
# DPI passado ao servidor Termux:X11 (maior = interface maior; bom para telas pequenas).
AMBXST_DPI=120
# Argumentos extras do termux-x11. "-ac" desativa o controle de acesso do X (só local, seguro no aparelho).
AMBXST_X11_ARGS=-ac
# 1 = inicia PulseAudio no Termux (escuta só em 127.0.0.1). Ignorado no modo econômico.
AMBXST_AUDIO=1
# 1 = compositor picom (cantos arredondados + transparência). Se falhar, o desktop segue sem efeitos.
AMBXST_PICOM=1
