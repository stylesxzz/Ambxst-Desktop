# Infynit AI - compositor (picom). Cantos arredondados e transparência.
# Se o Termux:X11 não suportar alguma extensão, o picom falha e o desktop segue sem efeitos
# (veja ambxst-logs autostart).
backend = "xrender";
vsync = false;
use-damage = false;
shadow = false;
fading = false;
corner-radius = 16;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'"
];
inactive-opacity = 0.94;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
